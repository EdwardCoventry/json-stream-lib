name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or version to publish (e.g., v0.0.2)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (build + node --test)
        run: npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # If triggered manually with a tag input, check out that tag
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            git fetch --tags
            git checkout "${{ github.event.inputs.tag }}"
          fi
          npm publish --access public

    # Ensure we fail clearly when the token is missing
    if: ${{ secrets.NPM_TOKEN != '' }}
